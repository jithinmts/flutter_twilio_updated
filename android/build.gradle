group 'federico.amura.flutter_twilio'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk = 36

    if (project.android.hasProperty("namespace")) {
        namespace = 'federico.amura.flutter_twilio'
    }

    defaultConfig {
        minSdk = 23
        targetSdk = 36
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        disable 'InvalidPackage'
    }

    // BuildConfig explicit (silences deprecated warning)
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    implementation "com.google.firebase:firebase-messaging:24.1.0"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21"

    // Twilio
    implementation "com.twilio:audioswitch:1.1.8"
    implementation "com.twilio:voice-android:6.6.1"

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Other
    implementation 'com.squareup.picasso:picasso:2.71828'
    // implementation files("libs/flutter.jar")

}
